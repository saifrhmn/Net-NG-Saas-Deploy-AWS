<ng-progress ngProgressHttp />

<mat-toolbar>
  <mat-toolbar-row>
    <button mat-icon-button (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>


    <div class="d-flex justify-between align-center w-100">
      <img class="logo-img" src="assets/img/Karbar_Logo.png" alt="logo" />

      <div class="d-flex gap-1">
        <div class="user-box d-flex align-center" [matMenuTriggerFor]="menu">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M13 5.5C10.2386 5.5 8.00002 7.73858 8.00002 10.5C8.00002 13.2614 10.2386 15.5 13 15.5C15.7614 15.5 18 13.2614 18 10.5C18 7.73858 15.7614 5.5 13 5.5ZM10.5 10.5C10.5 9.11929 11.6193 8 13 8C14.3807 8 15.5 9.11929 15.5 10.5C15.5 11.8807 14.3807 13 13 13C11.6193 13 10.5 11.8807 10.5 10.5Z"
              fill="#8AD6E8" />
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M22.1601 21.5055C19.8775 23.9626 16.6183 25.5 13 25.5C6.09644 25.5 0.5 19.9036 0.5 13C0.5 6.09644 6.09644 0.5 13 0.5C19.9036 0.5 25.5 6.09644 25.5 13C25.5 16.2045 24.2942 19.1274 22.3115 21.3396C22.3218 21.3803 22.3318 21.4214 22.3415 21.4626L22.1601 21.5055ZM3 13C3 7.47715 7.47715 3 13 3C18.5228 3 23 7.47715 23 13C23 15.189 22.2967 17.2137 21.1037 18.8604C21.0984 18.8542 21.0931 18.8479 21.0878 18.8417C20.4871 18.1366 19.7495 17.6693 18.9422 17.3627C17.4008 16.7772 15.4977 16.75 13.625 16.75H12.375C10.5196 16.75 8.73329 16.7722 7.31826 17.3838C6.40296 17.7794 5.69818 18.3872 5.17191 19.2232C3.81238 17.5154 3 15.3526 3 13ZM7.03867 21.0296C8.70332 22.2675 10.7661 23 13 23C15.4205 23 17.6401 22.1401 19.37 20.709C19.31 20.6189 19.2481 20.5373 19.1848 20.463C18.9002 20.129 18.5361 19.8827 18.0545 19.6998C17.018 19.3061 15.5944 19.25 13.625 19.25H12.375C10.3884 19.25 9.1605 19.3111 8.31013 19.6786C7.81361 19.8932 7.37771 20.246 7.03867 21.0296Z"

          <div class="user-content d-flex-column">
            <span class="name">{{ authenticatedUser?.unique_name }}</span>
          </div>

        </div>
      </div>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile"
    [ngClass]="{ collapsed: isCollapsed && !isMobile, mobile: isMobile }" class="side-navigation">
    <mat-nav-list>
      <ng-container *ngFor="let item of menuItems; let i = index">

        <!-- Skip Logout -->
        <ng-container *ngIf="item.label !== 'Logout'">

          <!-- No Submenu -->
          <ng-container *ngIf="!item.subMenu || item.subMenu.length === 0; else hasSubMenu">
            <a mat-list-item [routerLink]="item.route" [matTooltip]="item.label" [matTooltipDisabled]="!isCollapsed || isMobile" matTooltipPosition="right" routerLinkActive="active" class="childMenu" (click)="closeSidenavOnMobile()">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span class="label">{{ item.label }}</span>
            </a>
          </ng-container>

          <!-- Has Submenu -->
          <ng-template #hasSubMenu>

            <mat-expansion-panel class="menu-expansion-panel" hideToggle
              [expanded]="(!isCollapsed || isMobile) && expandedPanel === item.route" (opened)="expandedPanel = item.route"
              (closed)="expandedPanel = null">

              <mat-expansion-panel-header>
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span class="label" *ngIf="!isCollapsed || isMobile">{{ item.label }}</span>
                <span class="spacer"></span>
                <button mat-icon-button *ngIf="!isCollapsed || isMobile"
                  (click)="$event.stopPropagation(); togglePanel(item.route)">
                  <mat-icon class="text-white">{{ expandedPanel === item.route ? 'expand_less' : 'expand_more'
                    }}</mat-icon>
                </button>
              </mat-expansion-panel-header>

              <mat-nav-list *ngIf="!isCollapsed || isMobile">
                <ng-container *ngFor="let child of item.subMenu; let j = index">
                  <a mat-list-item [routerLink]="child.route" (click)="closeSidenavOnMobile()">
                    <span class="childmenu">
                      <mat-icon class="child-ico">{{ child.icon }}</mat-icon>
                    <span class="child-menu">{{ child.label }}</span>
                    </span>
                  </a>
                </ng-container>
              </mat-nav-list>
            </mat-expansion-panel>

          </ng-template>

        </ng-container>

      </ng-container>
    </mat-nav-list>


    <mat-nav-list class="logout-list">
      <a mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span class="label">Logout</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>


  <mat-sidenav-content [style.margin-left.px]="isMobile ? 0 : (isCollapsed ? 70 : 250)" class="sidenav-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-menu #menu="matMenu">
  <button mat-menu-item disabled>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
